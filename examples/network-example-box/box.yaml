# Network example manifest
# Docs: https://docs.destrier.io/contributing/box-structure#configure-box-yaml

# Identity
id: relay-yard
competitionId: reference-examples
version: 1.0.0
name: "Relay Yard"
authors: [destrier-team]

# Classification
runType: network
category: [web, lateral-movement]
difficulty: hard

# Objectives
objective: "Abuse the gateway fetcher to reach the internal workstation and read the flag"
flags:
  - host: workstation
    gating: user
    value: "destrier{r3l4y_y4rd_55rf_p1v07}"

# Networking
entrypoint:
  network: external

networks:
  - name: external
    cidr: 10.10.0.0/24
  - name: internal
    cidr: 10.10.1.0/24

# Hosts
hosts:
  - name: gateway
    kind: container
    build:
      source: target/gateway
    networks:
      - name: external
        ip: 10.10.0.10
      - name: internal
        ip: 10.10.1.10
    healthcheck: "http:8000/"
  - name: workstation
    kind: vm
    os: linux
    build:
      source: target/workstation
    networks:
      - name: internal
        ip: 10.10.1.20
    healthcheck: "http:8001/health"
