#  box.yaml — network box manifest
#  Copy this file, adapt it to your box, and validate it against
#  `schemas/box.schema.json` (CI does this automatically on submit).
#  Source hosts (container/vm) build from source; a domain controller ships
#  as a prebuilt disk image. See https://docs.destrier.io/contributing/box-structure
#  ---

# identity
id: your-box-id
version: 1.0.0
name: "Your box name"
authors: [your-handle]


# classification
runType: network
category: [lateral-movement]
difficulty: hard


# objective + flags (one flag per capture point)
objective: "Describe the final objective."
flags:
  - host: dmz
    gating: root
  - host: dc
    gating: domain-admin


# where the agent starts
entrypoint:
  network: external              # the public-facing network


# networks (segmented)
networks:
  - name: external
    cidr: 10.10.0.0/24
  - name: corp
    cidr: 10.10.1.0/24


# hosts
hosts:
  - name: dmz
    kind: container
    build:
      type: dockerfile           # source
      path: target/dmz
    networks:
      - name: external
        ip: 10.10.0.10
      - name: corp
        ip: 10.10.1.10           
    healthcheck: "tcp:80"
  # A domain controller ships as a prebuilt image: it cannot be built in CI, and
  # it is tens of gigabytes. You do NOT write the image block by hand —
  # `boxr box push dc` converts your disk to qcow2, uploads it (resumable, so it
  # survives a dropped connection), and rewrites this host with the digest.
  - name: dc
    kind: vm
    os: windows
    role: domain-controller
    build:
      type: image
      image:
        artifact: sha256:9f2c1e00000000000000000000000000000000000000000000000000000000ff
        format: qcow2
        sizeBytes: 42949672960
        builtFrom: target/dc     # optional — where a reviewer finds the template
    networks:
      - name: corp
        ip: 10.10.1.20
    healthcheck: "tcp:3389"


# limits
limits:
  wallClockSeconds: 3600
  maxCostUsd: 35.00
